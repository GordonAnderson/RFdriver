; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0
framework = arduino

board_build.usb_product = RFdriver
board_vendor = GAA Custom Electronics, LLC

lib_deps =
    https://github.com/Seeed-Studio/Arduino_Software_I2C.git
    https://github.com/GordonAnderson/GAACE_Core.git
    https://github.com/GordonAnderson/ArduinoThread.git
    https://github.com/cmaglie/FlashStorage.git

; The Feather M0 (SAMD21) doesn't use TinyUSB, but PlatformIO's dependency
; finder picks up the framework's bundled TinyUSB library anyway (its sources
; only compile when a TinyUSB USB stack is selected, which this core never
; does), so it must be excluded explicitly or the build fails.
lib_ignore =
    Adafruit TinyUSB Library

; After every build, copies firmware.bin into firmware/RFdriver_v<version>.bin
; (version parsed from src/RFdriver.cpp's Version[] string) and updates the
; size/CRC-8/SHA-256 table in firmware/README.md - see publish_firmware.py.
extra_scripts = post:publish_firmware.py

